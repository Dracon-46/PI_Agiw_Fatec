# =============================================================================
# nginx.conf — Proxy reverso Nginx para o módulo Conciliação Bancária
# Projeto Banco · Ticket 37060 · Agiw Sistemas
#
# Copie para: /etc/nginx/conf.d/conciliacao.conf
# Valide com: sudo nginx -t
# Aplique com: sudo systemctl reload nginx
# =============================================================================

# Configuração do upstream (app Next.js)
upstream conciliacao_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ==============================================================================
# Bloco HTTP — redireciona tudo para HTTPS
# (quando certificado SSL estiver configurado, descomentar o redirect abaixo)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Logs
    access_log /var/log/nginx/conciliacao_access.log;
    error_log  /var/log/nginx/conciliacao_error.log warn;

    # Headers de segurança
    add_header X-Frame-Options         "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options  "nosniff"                      always;
    add_header X-XSS-Protection        "1; mode=block"                always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # --- Opção A: Proxy direto (sem HTTPS — usar apenas em lab) ---
    location / {
        proxy_pass              http://conciliacao_app;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_buffering         off;
    }

    # Health check (sem log para não poluir)
    location = /health {
        proxy_pass http://conciliacao_app/api/health;
        access_log off;
    }

    # HTTP permanece aberto no lab para health check do CD.
    # Em produção com ACM+ALB, este bloco só existiria internamente.
}

# ==============================================================================
# HTTPS — certificado autoassinado gerado por infra/setup-ec2.sh
# O navegador avisa (esperado no AWS Academy, sem domínio/ACM).
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/conciliacao.crt;
    ssl_certificate_key /etc/ssl/private/conciliacao.key;

    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   off;
    ssl_session_timeout         1d;
    ssl_session_cache           shared:SSL:10m;
    ssl_session_tickets         off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options         "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options  "nosniff"                      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/conciliacao_ssl_access.log;
    error_log  /var/log/nginx/conciliacao_ssl_error.log warn;

    location / {
        proxy_pass              http://conciliacao_app;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
    }

    location = /health {
        proxy_pass http://conciliacao_app/api/health;
        access_log off;
    }
}
