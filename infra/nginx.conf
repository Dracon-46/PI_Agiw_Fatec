# =============================================================================
# nginx.conf — Proxy reverso Nginx para o módulo Conciliação Bancária
# Projeto Banco · Ticket 37060 · Agiw Sistemas
#
# Copie para: /etc/nginx/conf.d/conciliacao.conf
# Valide com: sudo nginx -t
# Aplique com: sudo systemctl reload nginx
# =============================================================================

# Configuração do upstream (app Next.js)
upstream conciliacao_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ==============================================================================
# Bloco HTTP — redireciona tudo para HTTPS
# (quando certificado SSL estiver configurado, descomentar o redirect abaixo)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Logs
    access_log /var/log/nginx/conciliacao_access.log;
    error_log  /var/log/nginx/conciliacao_error.log warn;

    # Headers de segurança
    add_header X-Frame-Options         "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options  "nosniff"                      always;
    add_header X-XSS-Protection        "1; mode=block"                always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # --- Opção A: Proxy direto (sem HTTPS — usar apenas em lab) ---
    location / {
        proxy_pass              http://conciliacao_app;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_buffering         off;
    }

    # Health check (sem log para não poluir)
    location = /health {
        proxy_pass http://conciliacao_app/api/health;
        access_log off;
    }

    # --- Opção B: Redirect para HTTPS (descomente quando tiver certificado) ---
    # return 301 https://$host$request_uri;
}

# ==============================================================================
# Bloco HTTPS — descomentar e preencher quando tiver certificado TLS
#
# Para gerar certificado self-signed (lab, sem domínio):
#   sudo openssl req -x509 -nodes -days 365 \
#     -newkey rsa:2048 \
#     -keyout /etc/ssl/private/conciliacao.key \
#     -out /etc/ssl/certs/conciliacao.crt \
#     -subj "/CN=conciliacao-agiw"
#
# Para domínio próprio com Let's Encrypt:
#   sudo certbot --nginx -d <seu-dominio>
#
# Com ALB da AWS (produção real):
#   O ALB termina o TLS com certificado do ACM.
#   O Nginx fica interno e só escuta HTTP (porta 80) na EC2.
