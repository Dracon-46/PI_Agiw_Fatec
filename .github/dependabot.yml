# Atualização automática de dependências, sempre em PR para a develop.
#
# Trocas de versão principal de pacotes npm mudam a API e exigem migração
# planejada do código; por isso não são abertas automaticamente. Correções e
# versões menores continuam chegando agrupadas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
