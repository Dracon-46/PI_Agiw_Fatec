# Entrega contínua do git flow. Roda a cada push na main, ou seja, a cada
# release ou hotfix integrado (por pull request ou por git push):
#
#   1. cria a tag da versão do package.json (e as de versões antigas que
#      estiverem faltando);
#   2. cria no GitHub a release de toda tag que ainda não tem uma;
#   3. publica a imagem Docker da versão atual no GHCR, se ainda não existir;
#   4. traz a main de volta para a develop;
#   5. apaga as branches feature/release/hotfix já integradas e as do
#      Dependabot sem pull request aberto.
#
# Cada etapa só faz o que falta, então o workflow pode ser executado de novo a
# qualquer momento em Actions > Release > Run workflow.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  versao:
    name: Tag da versão
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.tags.outputs.versao }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - id: tags
        name: Criar as tags que faltam
        run: .github/scripts/marca-versoes.sh

  github-release:
    name: Releases no GitHub
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Criar a release de cada tag que ainda não tem uma
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATUAL: v${{ needs.versao.outputs.versao }}
        run: |
          git fetch --tags --force
          for TAG in $(git tag -l 'v*' --sort=v:refname); do
            if gh release view "$TAG" >/dev/null 2>&1; then continue; fi
            if [ "$TAG" = "$ATUAL" ]; then ULTIMA=true; else ULTIMA=false; fi
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --latest="$ULTIMA"
          done

  imagem:
    name: Imagem no GHCR
    needs: versao
    runs-on: ubuntu-latest
    env:
      IMAGEM: ghcr.io/${{ github.repository }}
      VERSAO: ${{ needs.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.versao.outputs.versao }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: existe
        name: Conferir se a imagem da versão já foi publicada
        run: |
          IMAGEM_MINUSCULA="${IMAGEM,,}"
          if docker buildx imagetools inspect "$IMAGEM_MINUSCULA:$VERSAO" >/dev/null 2>&1; then
            echo "publicada=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicada=false" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        if: steps.existe.outputs.publicada == 'false'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=raw,value=${{ env.VERSAO }}
            type=raw,value=latest

      - if: steps.existe.outputs.publicada == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  develop:
    name: Sincronizar a develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Trazer a main para a develop
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "A develop já contém a main."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              merge --no-ff origin/main -m "Merge da main na develop"
          git push origin develop

  limpeza:
    name: Limpar branches integradas
    needs: develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apagar branches que já cumpriram seu papel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/limpa-branches.sh
