# Entrega: ao publicar uma release no GitHub (com a tag vX.Y.Z da versão
# fechada no git flow), a imagem é construída e publicada no GitHub Container
# Registry com a tag da versão e "latest".
#
# A release pode ser publicada pelo site (Releases > Draft a new release) ou
# pela linha de comando (gh release create vX.Y.Z --target main).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
