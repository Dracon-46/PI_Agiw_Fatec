# =============================================================================
# cd.yml — Continuous Deployment
# Projeto Banco · Ticket 37060 · Agiw Sistemas
#
# Executa apenas quando há merge na branch main.
# Pipeline: build → testes → deploy via SSH na EC2 AWS
#
# Secrets necessários no GitHub (Settings → Secrets and variables → Actions):
#   EC2_HOST           — IP público ou DNS da instância EC2
#   EC2_USER           — Usuário SSH (ex: ec2-user)
#   EC2_SSH_KEY        — Chave privada PEM completa (cat conciliacao-agiw.pem)
#   EC2_APP_DIR        — Caminho da aplicação na EC2 (ex: /home/ec2-user/conciliacao-agiw)
#
# Limitação do AWS Academy:
#   As credenciais AWS (access key, secret, session token) expiram a cada sessão
#   do Learner Lab (~4h). Por isso o deploy é feito via SSH direto na EC2,
#   sem usar a AWS CLI para push de imagem no ECR.
#
#   Em produção real, o fluxo seria:
#     1. Build da imagem Docker
#     2. Push para Amazon ECR
#     3. Deploy via ECS/EKS ou rolling update com AWS CLI
# =============================================================================

name: CD — Deploy EC2

on:
  push:
    branches: [main, projeto-nuvem-glauco]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Job 1: CI (reutiliza a mesma validação)
  # --------------------------------------------------------------------------
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        env:
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: '3306'
          MYSQL_USER: 'root'
          MYSQL_PASSWORD: 'ci_placeholder'
          MYSQL_DATABASE: 'conciliacao_agiw'
          BANK_PROVIDER: 'bradesco'
          BUILD_STANDALONE: '1'
        run: npm run build

      - name: Verificar artefato standalone
        run: |
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "❌ server.js ausente — build falhou"
            exit 1
          fi
          echo "✅ Build OK"

  # --------------------------------------------------------------------------
  # Job 2: Deploy na EC2 (somente após build com sucesso)
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy EC2
    runs-on: ubuntu-latest
    needs: build-and-validate

    # Garante que apenas um deploy rode por vez
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Deploy via SSH: git pull + docker compose up
      # A estratégia é "pull-based" — a EC2 busca o código do GitHub.
      # Em produção real, usaríamos ECR + ECS com rolling deployment.
      # ----------------------------------------------------------------------
      - name: Configurar chave SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?GitHub Actions secret EC2_HOST is missing}"
          : "${EC2_SSH_KEY:?GitHub Actions secret EC2_SSH_KEY is missing}"
          mkdir -p "$HOME/.ssh"
          echo "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

      - name: Deploy na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?GitHub Actions secret EC2_HOST is missing}"
          : "${EC2_USER:?GitHub Actions secret EC2_USER is missing}"
          : "${EC2_APP_DIR:?GitHub Actions secret EC2_APP_DIR is missing}"
          APP_DIR_Q=$(printf '%q' "$EC2_APP_DIR")
          DEPLOY_BRANCH_Q=$(printf '%q' "$DEPLOY_BRANCH")
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "${EC2_USER}@${EC2_HOST}" "APP_DIR=$APP_DIR_Q DEPLOY_BRANCH=$DEPLOY_BRANCH_Q bash -s" <<'ENDSSH'
            set -euo pipefail

            echo "Application directory: $APP_DIR"
            cd "$APP_DIR"

            echo "Updating branch $DEPLOY_BRANCH..."
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            echo "Building and starting containers..."
            docker compose up -d --build --remove-orphans

            echo "Applying database schema..."
            docker compose exec -T app node scripts/init-db.mjs

            echo "Waiting for containers to become healthy..."
            sleep 15

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 http://localhost:3000/api/health 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deploy succeeded! Health check HTTP $HTTP_CODE"
            else
              echo "Health check returned HTTP $HTTP_CODE"
              docker compose logs --tail=50 app
              exit 1
            fi

            docker image prune -f --filter "until=24h" 2>/dev/null || true
            echo "Deploy completed at $(date)"
          ENDSSH

      - name: Verificar deploy (health check externo)
        run: |
          echo "⏳ Aguardando aplicação estabilizar..."
          sleep 20

          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 "http://${{ secrets.EC2_HOST || vars.EC2_HOST }}" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Aplicação está online! HTTP $HTTP_CODE"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Tentativa $RETRY_COUNT/$MAX_RETRIES — HTTP $HTTP_CODE. Aguardando..."
            sleep 10
          done

          echo "⚠️  Aplicação não respondeu após $MAX_RETRIES tentativas."
          echo "    Verifique os logs: ssh ec2-user@${{ secrets.EC2_HOST || vars.EC2_HOST }} 'docker compose -f ${{ secrets.EC2_APP_DIR }}/docker-compose.yml logs app'"
          # Não falha o job — pode ser lag de inicialização ou HTTPS não configurado
          exit 0

      - name: Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
